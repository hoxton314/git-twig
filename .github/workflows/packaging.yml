name: Packaging

# Builds the Linux packages the release workflow ships, on the same runner,
# for PRs that touch packaging, so a broken bundle shows up before a tag.
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/ci.yml'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/commands/updater.rs'
      - 'packaging/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Same bundle as the release, without the updater signature (that key
      # only exists in the release environment).
      - name: Build AppImage and deb
        run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the AppImage
        run: |
          set -euo pipefail
          f=$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)
          ls -la "$f"
          chmod +x "$f"
          cd "$(mktemp -d)"
          "$f" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/twig
          # Desktop entry and icon at the AppImage root (named after productName).
          test -f squashfs-root/Twig.desktop
          grep -q '^Exec=twig' squashfs-root/Twig.desktop
          # The binary knows it was bundled as an AppImage, which is how the
          # in-app updater decides it may replace this file.
          grep -aq "__TAURI_BUNDLE_TYPE_VAR_APP" squashfs-root/usr/bin/twig

      - name: Check the deb
        run: |
          set -euo pipefail
          d=$(realpath src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb --info "$d"
          test "$(dpkg-deb --field "$d" Architecture)" = "${{ matrix.deb_arch }}"
          # Not `| grep -q`: with pipefail an early grep exit fails the step (SIGPIPE).
          dpkg-deb --contents "$d" > "$RUNNER_TEMP/deb-contents.txt"
          # Tauri's debs list paths without the usual "./" prefix.
          grep -qE '(^|[ /])usr/bin/twig$' "$RUNNER_TEMP/deb-contents.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: twig-linux-${{ matrix.deb_arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

  # The Flatpak repackages the amd64 .deb built above (see packaging/flatpak).
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: twig-linux-amd64
          path: dl

      - name: Put the .deb next to the manifest
        run: |
          set -eu
          ls -R dl
          cp dl/deb/*.deb packaging/flatpak/twig.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/dev.twig.app.yml
          bundle: twig.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/dev.twig.app.yml') }}

  # macOS and Windows bundles through the same signing scripts as the
  # release. PRs never get secrets, so this checks the unsigned path: the
  # scripts must leave a build without signing configuration untouched.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS code signing
        if: matrix.os == 'macos-latest'
        run: bash .github/scripts/signing-macos.sh

      - name: Configure Windows code signing
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./.github/scripts/signing-windows.ps1

      - name: Build
        shell: bash
        run: |
          # Vendored OpenSSL needs a native Perl on Windows; Git Bash's MSYS perl
          # can't build it (the release builds through tauri-action in pwsh,
          # which finds Strawberry Perl).
          if [ "$RUNNER_OS" = Windows ]; then export OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe; fi
          # TWIG_SIGN_ARGS is "--config <file>" (two words) when signing is set up.
          # shellcheck disable=SC2086
          npx tauri build --bundles ${{ matrix.bundles }} ${TWIG_SIGN_ARGS:-} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the bundle
        shell: bash
        run: |
          set -euo pipefail
          test -z "${TWIG_SIGN_ARGS:-}" || { echo "signing configured without secrets?"; exit 1; }
          if [ "${{ matrix.os }}" = macos-latest ]; then
            ls -d src-tauri/target/release/bundle/macos/Twig.app
            # The executable (named after the binary or the product).
            find src-tauri/target/release/bundle/macos/Twig.app/Contents/MacOS -type f -perm -u+x | grep -q .
          else
            ls src-tauri/target/release/bundle/nsis/*-setup.exe
          fi

