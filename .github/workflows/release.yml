name: Release Twig

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      # One at a time: every job read-modify-writes latest.json on the
      # release, and two finishing together (e.g. the x86_64 and ARM64 Linux
      # jobs) could drop each other's updater entries. Slower, but releases
      # are rare and a lost entry breaks updates for that platform.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          # Native ARM64 runner (free for public repos): deb, rpm and AppImage.
          - os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      # Code signing is used only when its secrets exist (docs/SIGNING.md);
      # otherwise these steps do nothing and the builds stay unsigned.
      - name: Configure macOS code signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/signing-macos.sh

      - name: Configure Windows code signing
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: ./.github/scripts/signing-windows.ps1

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          # Public OAuth App client ID for "Sign in with GitHub" (device flow).
          # A repository *variable*, not a secret; unset = sign-in hidden.
          TWIG_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TWIG_GITHUB_OAUTH_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Twig v__VERSION__'
          releaseBody: |
            See the assets below to download and install Twig v__VERSION__.

            **Linux** (x86_64 `amd64` or ARM64 `aarch64`/`arm64`): Download the `.deb` or `.rpm`, or the `.AppImage` for any other distribution (it updates itself)
            **macOS**: Download the `.dmg`
            **Windows**: Download the `.exe` installer
          releaseDraft: true
          prerelease: false
          # TWIG_SIGN_ARGS: the Windows signing config overlay, when configured.
          args: ${{ matrix.args }} ${{ env.TWIG_SIGN_ARGS }}

      - name: Upload AUR assets (desktop entry + icon)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp src-tauri/icons/icon.png twig.png
          gh release upload "$TAG" twig.desktop twig.png --clobber

  # Each matrix job read-modify-writes latest.json on the release, so a
  # near-simultaneous finish can drop a platform. Fail loudly if that happens
  # (re-run the affected build job to regenerate the entry).
  verify-updater-json:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json
          cat latest.json
          for key in linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage linux-aarch64-deb linux-aarch64-rpm linux-aarch64-appimage darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' latest.json > /dev/null \
              || { echo "::error::latest.json is missing updater platform '$key'"; exit 1; }
          done

  update-aur:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" aur/twig-bin/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: twig-bin
          pkgbuild: ./aur/twig-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.VERSION }}"
          force_push: true
