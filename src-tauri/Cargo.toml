[package]
name = "twig"
version = "0.5.0"
description = "Twig — A lightweight Git GUI. Lighter than the rest."
authors = ["Igor Kalicinski"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "twig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# `twig <path>` opens a tab in the running window. ~2.4: 2.5 needs tauri 2.12.
tauri-plugin-single-instance = "~2.4"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }
git2 = "0.20"
base64 = "0.22"
log = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
openssl = { version = "0.10", features = ["vendored"] }
# OS credential store for the GitHub token. zbus-based Secret Service on Linux
# (pure Rust, no libdbus needed at build time), Keychain on macOS,
# Credential Manager on Windows.
# OS credential store (keyring 4 layout: core + one store crate per platform).
# Entries written by keyring 3 are read unchanged (same Secret Service
# attributes, keychain items and Windows target names).
keyring-core = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
